aid: sudowrite
name: Sudowrite
description: >-
  Sudowrite is an AI writing platform built specifically for fiction and creative
  writers, used by 300,000+ authors from debut novelists to bestselling
  professionals. Its fiction-trained Muse AI model, alongside Story Bible
  (AI-powered character, worldbuilding, plot, and style memory), First Draft
  chapter drafting, and tools like Write, Rewrite, Describe, Expand, Brainstorm,
  and Canvas, helps writers draft, revise, and develop stories faster without
  sacrificing their voice. Sudowrite also offers a 1,000+ plugin marketplace,
  multi-model support (Sudowrite Muse, Claude, GPT, Gemini), and web plus
  iOS/Android apps. Named "a salvation" by The New Yorker and featured in The New
  York Times, The Verge, Time, and Wired. Sudowrite publishes no public developer
  API; the surface here is its consumer product, docs, and support properties.
